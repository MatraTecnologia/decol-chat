packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted
shamefullyHoist: false
publicHoistPattern:
  - "*@types*"
  - "*eslint*"
  - "*prettier*"
  - "*tailwindcss*"
preferWorkspacePackages: true
linkWorkspacePackages: true
autoInstallPeers: true
strictPeerDependencies: false
savePrefix: "^"
minimumReleaseAge: 4320

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  prisma-zod-generator: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - core-js-pure
  - esbuild
  - msgpackr-extract
  - prisma
  - prisma-zod-generator
  - sharp
  - unrs-resolver

overrides:
  "tmp@<=0.2.3": ">=0.2.4"
  "js-yaml@>=4.0.0 <4.1.1": ">=4.1.1"
  "devalue@>=5.1.0 <5.6.2": ">=5.6.2"
  "seroval@<1.4.1": ">=1.4.1"
  "diff@<4.0.4": ">=4.0.4"
