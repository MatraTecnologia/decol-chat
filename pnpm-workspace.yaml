packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted
shamefullyHoist: false
publicHoistPattern:
  - "*@types*"
  - "*eslint*"
  - "*prettier*"
  - "*tailwindcss*"
preferWorkspacePackages: true
linkWorkspacePackages: true
autoInstallPeers: true
strictPeerDependencies: false
savePrefix: "^"
minimumReleaseAge: 4320

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  prisma-zod-generator: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - core-js-pure
  - esbuild
  - msgpackr-extract
  - prisma
  - prisma-zod-generator
  - sharp
  - unrs-resolver

overrides:
  "tmp@<=0.2.3": ">=0.2.4"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "devalue@>=5.1.0 <5.6.2": ">=5.6.2"
  "seroval@<1.4.1": ">=1.4.1"
  "diff@<4.0.4": ">=4.0.4"
  # audit 2026-09-23: correções transitivas; "^" segura a major de cada linha
  "undici@>=7.0.0 <7.29.0": "^7.29.0"
  "fast-uri@>=3.0.0 <3.1.6": "^3.1.6"
  "fast-uri@>=4.0.0 <4.1.3": "^4.1.3"
  "nanoid@>=3.0.0 <3.3.18": "^3.3.18"
  "browserslist@<4.28.7": "^4.28.7"
  "baseline-browser-mapping@<2.11.0": "^2.11.0"
  "brace-expansion@>=1.0.0 <1.1.18": "^1.1.18"
  "brace-expansion@>=5.0.0 <5.0.9": "^5.0.9"
